server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: sdip
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # Zero-dependency demo runtime. The graded deployment uses the `pg` profile
    # (PostgreSQL 16 via docker-compose — see application-pg.yml / ADR-02).
    url: jdbc:h2:mem:sdip;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

sdip:
  seed:
    default-users: true
    demo-data: false
  linking:
    tau-high: 0.90
    tau-low: 0.68
  ingestion:
    chunk-size: 500
    skip-limit: 100
    upload-dir: ${java.io.tmpdir}/sdip-uploads
    seed-default-profiles: true
  security:
    jwt-secret-b64: ""           # SDIP_JWT_SECRET_B64 in real deployments
    credential-key-b64: ""       # falls back to documented dev key when blank
    cors-allowed-origins: ""
  connectors:
    scheduling-enabled: false
    poll-interval: PT15M

logging:
  level:
    root: info
    com.sdip: info
