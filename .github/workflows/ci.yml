name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend and browser checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install development tools
        run: npm ci

      - name: Test frontend helpers and preview server
        run: npm run test:frontend

      - name: Check interactions, responsive layouts, and accessibility
        run: npm run test:browser

      - name: Upload frontend diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: .cache/frontend-check/
          include-hidden-files: true
          if-no-files-found: ignore

  verify:
    name: Build, test and verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package (skip tests)
        run: ./mvnw -B -DskipTests package

      - name: Verify (full reactor)
        run: ./mvnw -B verify

      - name: PostgreSQL integration tests
        run: ./mvnw -B -pl sdip-api -am test -Dgroups=pg -DexcludedGroups=
        env:
          CI: true

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports"
          if-no-files-found: ignore
