services:
  postgres:
    image: postgres:16-alpine
    container_name: sdip-postgres
    environment:
      POSTGRES_DB: ${PGDATABASE:-sdip}
      POSTGRES_USER: ${PGUSER:-sdip}
      POSTGRES_PASSWORD: ${PGPASSWORD:-sdip}
    ports:
      - "5432:5432"
    volumes:
      - sdip-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-sdip} -d ${PGDATABASE:-sdip}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    container_name: sdip-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: pg
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-sdip}
      PGUSER: ${PGUSER:-sdip}
      PGPASSWORD: ${PGPASSWORD:-sdip}
      # Demo bootstrap: four users, four athletes, GPS + force data.
      SDIP_SEED_DEFAULT_USERS: "true"
      SDIP_SEED_DEMO_DATA: "true"
      SDIP_JWT_SECRET_B64: ${SDIP_JWT_SECRET_B64:-}
      SDIP_CREDENTIAL_KEY_B64: ${SDIP_CREDENTIAL_KEY_B64:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  sdip-pgdata:
