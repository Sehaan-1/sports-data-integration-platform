spring:
  datasource:
    url: jdbc:h2:mem:sdip-ingest-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

sdip:
  seed:
    default-users: false
  linking:
    tau-high: 0.90
    tau-low: 0.68
  ingestion:
    chunk-size: 500
    skip-limit: 100
    seed-default-profiles: true
